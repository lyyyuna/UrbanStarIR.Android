plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lyyyuna.urbanstarir'
    compileSdkVersion 35  // Android 15
    buildToolsVersion "35.0.0"
    ndkVersion "25.2.9519653"

    defaultConfig {
        applicationId "com.lyyyuna.urbanstarir"
        minSdkVersion 24  // Android 7.0
        targetSdkVersion 35  // Android 15
        versionCode 1
        versionName "1.0"

        // 支持的 ABI
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    // 配置 JNI 库目录
    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.12.0'

    // Fix Kotlin stdlib conflicts
    constraints {
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22") {
            because("kotlin-stdlib-jdk7 is now part of kotlin-stdlib")
        }
        implementation("org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22") {
            because("kotlin-stdlib-jdk8 is now part of kotlin-stdlib")
        }
    }
}
